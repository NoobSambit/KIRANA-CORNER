<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="awning-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Global shadow group -->
  <g filter="url(#shadow)">
    <!-- Map Pin Background (Variable Thickness, Perfect Teardrop Cavity) -->
    <path d="M 125 119 
             A 160 160 0 0 0 96 210 
             C 96 350, 180 440, 256 480 
             C 332 440, 416 350, 416 210 
             A 160 160 0 0 0 387 119 
             A 19 19 0 0 0 354 136 
             C 376 210, 320 350, 256 350 
             C 192 350, 136 210, 158 136 
             A 19 19 0 0 0 125 119 Z" 
          fill="#FF7A00" />

    <!-- Wi-Fi Signal (Classic layout, Bursting out) -->
    <g fill="none" stroke="#7CB342" stroke-width="22" stroke-linecap="round">
      <path d="M 176 143 A 105 105 0 0 1 336 143" />
      <path d="M 199 162 A 75 75 0 0 1 313 162" />
      <path d="M 222 181 A 45 45 0 0 1 290 181" />
    </g>

    <!-- Building Group (Integrated 3D design) -->
    <g>
      <!-- Building Facade -->
      <rect x="196" y="285" width="120" height="45" fill="#F4F4F4" rx="2" />
      
      <!-- Door -->
      <rect x="244" y="302" width="24" height="28" fill="#2C2C2C" rx="1" />
      
      <!-- Window -->
      <rect x="282" y="306" width="18" height="18" fill="#FF7A00" rx="2" />

      <!-- Awning Group -->
      <g filter="url(#awning-shadow)">
        <!-- Segment 1 (Leftmost) -->
        <path d="M 201 270 L 228.5 270 L 223.5 295 A 18 8 0 0 1 191 295 Z" fill="#FF8215" />
        <!-- Segment 2 -->
        <path d="M 228.5 270 L 256 270 L 256 295 A 18 8 0 0 1 223.5 295 Z" fill="#EB6000" />
        <!-- Segment 3 -->
        <path d="M 256 270 L 283.5 270 L 288.5 295 A 18 8 0 0 1 256 295 Z" fill="#FF8215" />
        <!-- Segment 4 (Rightmost) -->
        <path d="M 283.5 270 L 311 270 L 321 295 A 18 8 0 0 1 288.5 295 Z" fill="#EB6000" />
      </g>
    </g>
  </g>
</svg>
